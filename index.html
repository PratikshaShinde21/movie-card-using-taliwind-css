<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tailwind CSS Movie Cards</title>
</head>
<body>
    <div class="bg-gray-800 w-fit p-2 mt-8 ms-8 rounded-md relative">
        <img src="./download.webp" alt="Poster" class="w-[100px] h-[200px] object-cover rounded-md mx-auto">

        <span class="text-white font-bold text-md">Triple Seat</span>
        <p class="text-xs">
            <span class="text-gray-400">2019</span>
            <span class="text-gray-400">|</span>
            <span class="text-gray-400">Trailer</span>
        </p>

         <img src="./bookmark.png" alt="Bookmark" 
         class="w-6 h-6 object-contain cursor-pointer absolute bottom-13 right-3"/>

        <div class="flex justify-around py-2">
            <button class="bg-rose-600 text-white text-sm w-[60px] rounded-xs">Play</button>
            <button class="bg-slate-600 text-white text-sm w-[60px] ms-2 rounded-xs">My List</button>
        </div>
       
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</body>
</html>
